        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Naskh Arabic', serif;
            background: linear-gradient(145deg, #f8f3ff 0%, #e8e2f7 25%, #f0ebe8 50%, #faf7f2 75%, #ffffff 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية متحركة بتأثير الريش */
        .feathers-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .feather {
            position: absolute;
            opacity: 0.4;
            animation: float 12s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-10vh) rotate(180deg);
                opacity: 0;
            }
        }

        /* أوراق متحركة */
        .leaves-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .leaf {
            position: absolute;
            font-size: 18px;
            animation: drift 15s infinite;
            opacity: 0.5;
        }

        @keyframes drift {
            0% {
                transform: translateX(-10vw) translateY(-10vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            50% {
                opacity: 0.8;
                transform: translateX(50vw) translateY(50vh) rotate(180deg);
            }
            90% {
                opacity: 0.4;
            }
            100% {
                transform: translateX(110vw) translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 25px;
            position: relative;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
            animation: gentleFadeIn 2s ease-out;
        }

        .name-title {
            font-size: clamp(32px, 8vw, 42px);
            font-weight: 700;
            background: linear-gradient(135deg, #8b5a9f, #c49ac7, #e6b3cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            text-shadow: 2px 2px 8px rgba(139, 90, 159, 0.1);
            letter-spacing: 3px;
            position: relative;
        }

        .name-title::after {
            content: '✨';
            position: absolute;
            top: -10px;
            right: -20px;
            font-size: 20px;
            animation: sparkle 3s infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0.5; transform: scale(1) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
        }

        .description {
            font-size: clamp(16px, 4.2vw, 20px);
            color: #6b5b73;
            font-weight: 500;
            margin-bottom: 10px;
            text-shadow: 1px 1px 3px rgba(107, 91, 115, 0.1);
            line-height: 1.6;
        }

        .poem-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 30px 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(196, 154, 199, 0.3);
            box-shadow: 
                0 10px 40px rgba(139, 90, 159, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);
            animation: slideUp 1.5s ease-out 0.5s both;
            position: relative;
            overflow: hidden;
        }

        .poem-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(196, 154, 199, 0.1), transparent);
            animation: shimmer 4s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .poem-title {
            font-size: clamp(20px, 5.5vw, 24px);
            color: #8b5a9f;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            position: relative;
            z-index: 2;
        }

        .daily-poem {
            font-size: clamp(17px, 4.5vw, 19px);
            color: #5d4e66;
            line-height: 2;
            text-align: center;
            font-weight: 500;
            position: relative;
            z-index: 2;
            font-style: italic;
            text-shadow: 1px 1px 2px rgba(93, 78, 102, 0.1);
        }

        .share-btn {
            display: block;
            width: 75%;
            margin: 25px auto 0;
            background: linear-gradient(135deg, #c49ac7, #e6b3cc, #f2d7d9);
            border: none;
            border-radius: 25px;
            padding: 14px 20px;
            color: #5d4e66;
            font-size: clamp(14px, 4vw, 16px);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 5px 20px rgba(196, 154, 199, 0.3);
            position: relative;
            z-index: 2;
            font-family: inherit;
            border: 1px solid rgba(139, 90, 159, 0.2);
        }

        .share-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(196, 154, 199, 0.4);
            background: linear-gradient(135deg, #d4aed7, #f0c7d2, #f8e4e6);
        }

        .share-btn:active {
            transform: translateY(-1px);
        }

        .countdown-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 30px 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(196, 154, 199, 0.3);

            font-size: clamp(20px, 5.5vw, 24px);
            color: #8b5a9f;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .time-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .time-item {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.8), rgba(246, 240, 249, 0.6));
            border-radius: 20px;
            padding: 20px 12px;
            border: 1px solid rgba(196, 154, 199, 0.2);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .time-item::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #c49ac7, #e6b3cc, #f6f0f9, #c49ac7);
            border-radius: 22px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .time-item:hover::before {
            opacity: 0.3;
        }

        .time-item:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 30px rgba(196, 154, 199, 0.2);
        }

            color: #8b5a9f;

            color: #6b5b73;

            font-weight: 600;

        }

        }

        }

        @keyframes softPulse {

            50% { transform: scale(1.02); }
        }

        @keyframes gentleFadeIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        }

        .hover-lift:hover {
            transform: translateY(-2px);
            transition: all 0.3s ease;
        }
    </style>

        // إعدادات عيد الميلاد
        const BIRTHDAY_MONTH = 1;
        const BIRTHDAY_DAY = 1;

        let countdownInterval;
        let birthdayDate;
        let currentPoem = '';

        // حساب تاريخ عيد الميلاد القادم
        function calculateNextBirthday() {
            const now = new Date();
            const currentYear = now.getFullYear();
            let birthday = new Date(currentYear, BIRTHDAY_MONTH - 1, BIRTHDAY_DAY);
            
            if (birthday <= now) {
                birthday.setFullYear(currentYear + 1);
            }
            
            return birthday;
        }

        // إنشاء الريش المتحرك
        function createFeather() {
            const feather = document.createElement('div');
            feather.classList.add('feather');
            feather.style.left = Math.random() * 100 + '%';
            feather.style.fontSize = (Math.random() * 15 + 20) + 'px';
            feather.style.animationDelay = Math.random() * 3 + 's';
            
            const featherSymbols = ['🪶', '🕊️', '🤍'];
            feather.textContent = featherSymbols[Math.floor(Math.random() * featherSymbols.length)];
            
            document.getElementById('feathersContainer').appendChild(feather);

            setTimeout(() => {
                if (feather.parentNode) {
                    feather.remove();
                }
            }, 12000);
        }

        // إنشاء الأوراق المتحركة
        function createLeaf() {
            const leaf = document.createElement('div');
            leaf.classList.add('leaf');
            leaf.style.top = Math.random() * 30 + '%';
            leaf.style.animationDelay = Math.random() * 5 + 's';
            
            const leafSymbols = ['🌸', '🌺', '🌻', '🌷', '🌼', '🌿', '🍃'];
            leaf.textContent = leafSymbols[Math.floor(Math.random() * leafSymbols.length)];
            
            document.getElementById('leavesContainer').appendChild(leaf);

            setTimeout(() => {
                if (leaf.parentNode) {
                    leaf.remove();
                }
            }, 15000);
        }

        setInterval(createFeather, 3000);
        setInterval(createLeaf, 2500);

        // وظيفة العد التنازلي
        function updateCountdown() {
            const now = new Date().getTime();
            const distance = birthdayDate - now;

            if (distance < 0) {
                document.getElementById('dailyPoem').innerHTML = "🎉 عيد ميلاد سعيد نجلاء الجميلة! 🎉<br>كل عام وأنت أجمل وأكثر إشراقاً";
                clearInterval(countdownInterval);
                showNotification('🎂 عيد ميلاد سعيد للجميلة نجلاء! 🎂');
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;

            // اختيار البيت بناءً على الأيام المتبقية
            const poemIndex = days % dailyPoems.length;
            currentPoem = dailyPoems[poemIndex];
            document.getElementById('dailyPoem').textContent = currentPoem;
        }

        // نسخ البيت مباشرة - محسن للكمبيوتر والهاتف
        function copyPoem() {
            if (!currentPoem) {
                showNotification('لا يوجد بيت للنسخ!');
                return;
            }

            // النص المراد نسخه فقط البيت بدون إضافات
            const textToCopy = currentPoem;

            // الطريقة الحديثة للنسخ (تعمل على المتصفحات الحديثة)
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    showNotification('تم نسخ البيت بنجاح! 📋');
                }).catch(() => {
                    // في حالة الفشل، استخدم الطريقة القديمة
                    fallbackCopyToClipboard(textToCopy);
                });
            } else {
                // الطريقة القديمة للنسخ (متوافقة مع المتصفحات القديمة)
                fallbackCopyToClipboard(textToCopy);
            }
        }

        // الطريقة الاحتياطية للنسخ
        function fallbackCopyToClipboard(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            
            // إعدادات لجعل العنصر غير مرئي ولكن قابل للتحديد
            textArea.style.position = 'fixed';
            textArea.style.left = '-9999px';
            textArea.style.top = '-9999px';
            textArea.style.opacity = '0';
            textArea.style.pointerEvents = 'none';
            textArea.style.tabIndex = '-1';
            
            document.body.appendChild(textArea);
            
            // تحديد النص
            textArea.focus();
            textArea.select();
            textArea.setSelectionRange(0, 99999); // للهواتف المحمولة
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showNotification('تم نسخ البيت بنجاح! 📋');
                } else {
                    showNotification('فشل في نسخ البيت. جرب مرة أخرى.');
                }
            } catch (err) {
                console.error('خطأ في النسخ:', err);
                showNotification('لا يمكن نسخ البيت. جرب تحديد النص يدوياً.');
            }
            
            document.body.removeChild(textArea);
        }

        // وظيفة النسخ القديمة - محدثة لتستخدم الوظيفة المحسنة
        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showNotification('تم نسخ النص بنجاح! 📋');
                }).catch(() => {
                    fallbackCopyToClipboard(text);
                });
            } else {
                fallbackCopyToClipboard(text);
            }
        }

        // مشاركة البيت (احتفظنا بها كوظيفة احتياطية)
        function sharePoem() {
            if (!currentPoem) {
                showNotification('لا يوجد بيت للمشاركة!');
                return;
            }

            const shareText = `${currentPoem}\n\n🌸 أبيات في جمال نجلاء`;

            if (navigator.share) {
                navigator.share({
                    title: 'أبيات جميلة لنجلاء',
                    text: shareText,
                    url: window.location.href
                }).then(() => {
                    showNotification('تم مشاركة الأبيات بنجاح! 🌿');
                }).catch(() => {
                    copyToClipboard(shareText);
                });
            } else {
                copyToClipboard(shareText);
            }
        }

        // نسخ النص للحافظة
        function copyToClipboard(text) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    showNotification('تم نسخ الأبيات! يمكنك مشاركتها الآن 📋');
                }).catch(() => {
                    fallbackCopyToClipboard(text);
                });
            } else {
                fallbackCopyToClipboard(text);
            }
        }

        // نسخ احتياطي للحافظة
        function fallbackCopyToClipboard(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.opacity = '0';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                document.execCommand('copy');
                showNotification('تم نسخ الأبيات! يمكنك مشاركتها الآن 📋');
            } catch (err) {
                showNotification('لم يتم النسخ! جرب مرة أخرى');
            }
            
            document.body.removeChild(textArea);
        }

        // عرض الإشعارات
        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');

            setTimeout(() => {
                notification.classList.remove('show');
            }, 4000);
        }

        // إضافة تأثيرات تفاعلية
        function addInteractiveEffects() {
            const timeItems = document.querySelectorAll('.time-item');
            
            timeItems.forEach(item => {
                item.addEventListener('click', function() {
                    this.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 200);
                });
            });

            // تأثير الاهتزاز الناعم للإشعارات
            const originalShowNotification = window.showNotification;
            window.showNotification = function(message) {
                if (navigator.vibrate) {
                    navigator.vibrate([50, 30, 50]);
                }
                originalShowNotification(message);
            };
        }

        // بدء العداد عند تحميل الصفحة
        window.addEventListener('load', function() {
            birthdayDate = calculateNextBirthday().getTime();
            countdownInterval = setInterval(updateCountdown, 1000);
            updateCountdown();
            
            addInteractiveEffects();
            
            setTimeout(() => {
                showNotification('مرحباً بك في عالم الجمال والأناقة 🌸');
            }, 1800);
        });

        // تحسين الأداء - إيقاف الأنيميشن عند عدم رؤية الصفحة
        document.addEventListener('visibilitychange', function() {
            const feathers = document.querySelectorAll('.feather');
            const leaves = document.querySelectorAll('.leaf');
            
            if (document.hidden) {
                feathers.forEach(feather => feather.style.animationPlayState = 'paused');
                leaves.forEach(leaf => leaf.style.animationPlayState = 'paused');
            } else {
                feathers.forEach(feather => feather.style.animationPlayState = 'running');
                leaves.forEach(leaf => leaf.style.animationPlayState = 'running');
            }
        });
    </script>
</body>
</html>
